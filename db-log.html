  <!-- スクリプト -->
  <script>
    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');
    const lightboxPrev = document.getElementById('lightboxPrev');
    const lightboxNext = document.getElementById('lightboxNext');

    let currentImages = [];
    let currentIndex = 0;

    const masonryContainer = document.querySelector('.masonry-container');
    const originalItems = Array.from(masonryContainer.querySelectorAll('.masonry-item'));

    // ★ Z字順（左→右）に列へ振り分け配置する処理 ★
    function renderMasonry() {
      const cols = window.innerWidth <= 600 ? 2 : 3;
      masonryContainer.innerHTML = '';

      const colElements = [];
      for (let i = 0; i < cols; i++) {
        const col = document.createElement('div');
        col.className = 'masonry-col';
        masonryContainer.appendChild(col);
        colElements.push(col);
      }

      // インデックス順に各列へ交互に配置（スマホなら 01左, 02右, 03左, 04右...）
      originalItems.forEach((item, index) => {
        colElements[index % cols].appendChild(item);
      });
    }

    renderMasonry();

    // 画面サイズ変更時に列数を再調整
    window.addEventListener('resize', () => {
      const currentCols = masonryContainer.children.length;
      const newCols = window.innerWidth <= 600 ? 2 : 3;
      if (currentCols !== newCols) {
        renderMasonry();
      }
    });

    // ★ ライトボックス設定（元の連番順 01〜21 を維持してスライド） ★
    originalItems.forEach((item, index) => {
      item.addEventListener('click', () => {
        currentImages = originalItems.map(el => el.querySelector('img').src);
        currentIndex = index;
        openLightbox();
      });
    });

    function openLightbox() {
      lightboxImg.src = currentImages[currentIndex];
      lightboxModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightboxModal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
      lightboxImg.src = currentImages[currentIndex];
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % currentImages.length;
      lightboxImg.src = currentImages[currentIndex];
    }

    lightboxClose.addEventListener('click', (e) => {
      e.stopPropagation();
      closeLightbox();
    });

    lightboxPrev.addEventListener('click', (e) => { e.stopPropagation(); showPrev(); });
    lightboxNext.addEventListener('click', (e) => { e.stopPropagation(); showNext(); });

    document.addEventListener('keydown', (e) => {
      if (!lightboxModal.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showPrev();
      if (e.key === 'ArrowRight') showNext();
    });

    // スマホスワイプ・タップ送り
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;
    let isSwiped = false;

    lightboxModal.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
      isSwiped = false;
    }, { passive: true });

    lightboxModal.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].clientX;
      touchEndY = e.changedTouches[0].clientY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
        isSwiped = true;
        if (diffX < 0) showNext();
        else showPrev();
      }
    }, { passive: true });

    lightboxModal.addEventListener('click', (e) => {
      if (e.target.closest('#lightboxClose')) return;
      if (window.innerWidth <= 600) {
        if (isSwiped) {
          isSwiped = false;
          return;
        }
        const clickX = e.clientX;
        if (clickX < window.innerWidth / 2) showPrev();
        else showNext();
      } else {
        if (e.target === lightboxModal || e.target.id === 'lightboxContent') {
          closeLightbox();
        }
      }
    });
  </script>
</body>
</html>
